# ==========================================
# GLOBAL & DEFAULT CONFIGURATION (PRODUCTION)
# ==========================================
server:
  port: ${PORT:8081} # Uses 8081 locally to avoid conflict with user-service (8080)
  address: 0.0.0.0
  error:
    include-message: always

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:-}
    template:
      retry:
        enabled: true
        initial-interval: 3000ms
        max-attempts: 3
    listener:
      simple:
        initialize-consumers: true
        
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

---
# ==========================================
# OVERRIDES FOR LOCAL DEVELOPMENT ENVIRONMENT
# ==========================================
spring:
  config:
    activate:
      on-profile: local
  json:
    value:
      default:
        type: pt.kkosmico.notificationservice.dto.UserCreatedEvent
  datasource:
    url: jdbc:mysql://localhost:3306/user_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: rootroot
  rabbitmq:
    addresses: null # Clears the cloud variable to enforce local parameters
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  # ... keeping your current profiles and rabbitmq config untouched
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${SPRING_MAIL_USERNAME:00f3b163bab987} # Fallback to your Mailtrap username
    password: ${SPRING_MAIL_PASSWORD:b31ded122894b4} # Click show/copy on Mailtrap for the full password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

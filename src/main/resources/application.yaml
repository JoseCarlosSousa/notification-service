# ==========================================
# GLOBAL & DEFAULT CONFIGURATION (PRODUCTION)
# ==========================================
server:
  port: ${PORT:8081}
  address: 0.0.0.0
  error:
    include-message: always

spring:
  profiles:
    active: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:-jdbc:mysql://localhost:3306/user_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:-root}
    password: ${SPRING_DATASOURCE_PASSWORD:-rootroot}
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:-}
    template:
      retry:
        enabled: true
        initial-interval: 3000ms
        max-attempts: 3
    listener:
      simple:
        initialize-consumers: true
        
  mail:
    host: ${SPRING_MAIL_HOST:-sandbox.smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:-00f3b163bab987}
    password: ${SPRING_MAIL_PASSWORD:-b31ded122894b4}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

---
